<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEF ONLINE</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#060912;--gold:#FFCC33;--gold2:#D4A017;--dim:#7A7A9A;--green:#2ECC71;--red:#FF4D4D}
body{background:var(--bg);color:#F0EAD6;font-family:'Inter',sans-serif}
.header{position:sticky;top:0;background:#060912;border-bottom:2px solid var(--gold2);padding:14px;display:flex;justify-content:center}
.logo{font-family:'Cinzel';font-weight:800;letter-spacing:6px;color:var(--gold);font-size:21px}
.wrap{max-width:480px;margin:0 auto;padding:10px 10px 90px}
.card{border:1.5px solid var(--gold2);background:linear-gradient(180deg,#101426,#080B18);margin-bottom:12px;overflow:hidden}
.head{padding:12px 14px;border-bottom:1px solid rgba(255,204,51,.15)}
.head-title{font-family:'Cinzel';color:var(--gold);font-size:12px;letter-spacing:2px;font-weight:800}
.comp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.comp-big{border:2px solid var(--gold2);background:linear-gradient(180deg,#1A1A2E,#080B18);padding:18px 14px;cursor:pointer;min-height:110px;display:flex;flex-direction:column;justify-content:space-between}
.comp-big-name{font-family:'Cinzel';font-size:14px;font-weight:800;color:var(--gold)}
.comp-big-meta{font-size:10px;color:var(--dim);margin-top:8px}
.comp-big-status{font-size:9px;color:#000;background:var(--gold);padding:3px 6px;display:inline-block;margin-top:10px;font-weight:800}
.match-card{padding:12px;border-bottom:1px solid rgba(255,255,255,.06)}
.match-comp{font-size:9px;color:var(--gold);border:1px solid var(--gold2);padding:2px 6px;display:inline-block;margin-bottom:6px}
.match-line{font-family:'Cinzel';font-size:13px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#060912;border-top:2px solid var(--gold2);display:grid;grid-template-columns:repeat(5,1fr);max-width:480px;margin:0 auto}
.nav-item{padding:10px 2px;text-align:center;color:var(--dim);font-size:9px;cursor:pointer}.nav-item.active{color:var(--gold)}
.page{display:none}.page.active{display:block}
</style>
</head>
<body>
<div class="header"><div class="logo">LEF ONLINE</div></div>
<div class="wrap">
<div id="page-inicio" class="page active">
  <div class="card"><div class="head"><div class="head-title">COMPETIÇÕES</div></div><div class="comp-grid" id="comp-grid"></div></div>
  <div class="card"><div class="head"><div class="head-title">ÚLTIMAS DISPUTAS</div></div><div id="ultimas-disputas"></div></div>
</div>
<div id="page-competicao" class="page"><div class="card"><div style="padding:10px;color:var(--gold);cursor:pointer" onclick="switchPage('inicio')">‹ VOLTAR</div><div class="head"><div class="head-title" id="comp-det-title"></div></div><div id="comp-det-content"></div></div></div>
<div id="page-disputas" class="page"><div class="card"><div class="head"><div class="head-title">HISTÓRICO</div></div><div id="lista-disputas"></div></div></div>
<div id="page-ranking" class="page"><div class="card"><div class="head"><div class="head-title">RANKING</div></div><div id="ranking-content"></div></div></div>
<div id="page-imprensa" class="page"><div class="card"><div class="head"><div class="head-title">IMPRENSA</div></div><div id="imprensa-list"></div></div></div>
<div id="page-negocios" class="page"><div class="card"><div class="head"><div class="head-title">NEGÓCIOS</div></div><div id="negocios-content"></div></div></div>
</div>
<div class="nav">
  <div class="nav-item active" data-p="inicio">🏛️<br>Início</div>
  <div class="nav-item" data-p="disputas">⚔️<br>Disputas</div>
  <div class="nav-item" data-p="ranking">🏆<br>Ranking</div>
  <div class="nav-item" data-p="imprensa">📰<br>Imprensa</div>
  <div class="nav-item" data-p="negocios">💼<br>Negócios</div>
</div>
<script>
const competicoes=[
  {id:'ouro',nome:'LIGA OURO',temporada:'T14 • RODADA 13',status:'AO VIVO',desc:'Elite • 12 times'},
  {id:'prata',nome:'LIGA PRATA',temporada:'T14 • RODADA 12',status:'RODADA 12',desc:'Acesso • 12 times'},
  {id:'copa',nome:'COPA LEF',temporada:'QUARTAS • MATA-MATA',status:'MATA-MATA',desc:'Obrigatório vencer'},
  {id:'liberta',nome:'LIBERTADORES LEF',temporada:'FASE GRUPOS',status:'GRUPOS',desc:'Continental'},
];
const disputas=[
  {id:1,casa:'TIGRES FC',fora:'LOBOS FC',comp:'LIGA OURO',estadio:'Arena Tigres • Renda R$ 42.300',mandante:'TIGRES FC',jogadoresCasa:[{nome:'Raykon',gol:true},{nome:'Lucas Silva',gol:false}],jogadoresFora:[{nome:'Marcos',gol:true}],rodada:13,data:'Hoje',mataMata:false},
];
function renderInicio(){
  document.getElementById('comp-grid').innerHTML=competicoes.map(c=>`<div class="comp-big" onclick="openComp('${c.id}')"><div><div class="comp-big-name">${c.nome}</div><div class="comp-big-meta">${c.temporada}<br>${c.desc}</div></div><div class="comp-big-status">${c.status}</div></div>`).join('');
}
function openComp(id){document.getElementById('comp-det-title').innerText=id;switchPage('competicao');}
function switchPage(p){document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));document.getElementById('page-'+p).classList.add('active');document.querySelectorAll('.nav-item').forEach(e=>e.classList.remove('active'));const nav=document.querySelector(`[data-p="${p}"]`);if(nav)nav.classList.add('active');}
document.querySelectorAll('.nav-item').forEach(e=>e.addEventListener('click',()=>switchPage(e.dataset.p)));
renderInicio();
</script>
</body>
</html>
