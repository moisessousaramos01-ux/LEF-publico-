<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEF ONLINE V6.1</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#060912;color:#F0EAD6;font-family:'Inter',sans-serif}
.header{background:#000;padding:12px;display:flex;justify-content:space-between;border-bottom:2px solid #D4A017}
.logo{font-family:'Cinzel';color:#FFCC33;font-weight:700}
.live{background:#FF4D4D;padding:4px 8px;border-radius:4px;font-size:10px;font-weight:800}
.wrap{max-width:720px;margin:0 auto;padding:10px;padding-bottom:80px}
.card{background:#101426;border:1.5px solid #D4A017;border-radius:10px;padding:12px;margin-bottom:10px;border-left:4px solid #2ECC71}
.badge{padding:2px 6px;border-radius:10px;font-size:9px;font-weight:800;background:#FFCC33;color:#000}
.small{font-size:10px;color:#7A7A9A}
.placar{font-size:22px;font-weight:800;color:#FFCC33}
.nav{position:fixed;bottom:0;left:0;right:0;background:#060912;border-top:2px solid #D4A017;display:flex;justify-content:space-around;padding:8px 0;max-width:720px;margin:0 auto}
.nav-item{font-size:10px;text-align:center;color:#7A7A9A;cursor:pointer}.nav-item.active{color:#FFCC33}
.page{display:none}.page.active{display:block}
.elenco-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.jog-card{background:#1a1f36;padding:8px;border-radius:8px;text-align:center;font-size:11px}
</style>
</head>
<body>
<div class="header"><div class="logo">LEF ONLINE V6.1</div><div class="live">AO VIVO</div></div>
<div class="wrap">
<div id="page-inicio" class="page active"><div id="feed-inicio"></div></div>
<div id="page-disputas" class="page"><div id="feed-disputas"></div></div>
<div id="page-elencos" class="page"><div id="feed-elencos"></div></div>
<div id="page-negocios" class="page"><div id="feed-leiloes"></div><div id="feed-hist"></div></div>
<div id="page-ranking" class="page"><div id="feed-ranking"></div></div>
</div>
<div class="nav">
<div class="nav-item active" data-p="inicio">🏠<br>Inicio</div><div class="nav-item" data-p="disputas">⚔️<br>Disputas</div><div class="nav-item" data-p="elencos">👕<br>Elencos</div><div class="nav-item" data-p="negocios">💰<br>Negócios</div><div class="nav-item" data-p="ranking">🏆<br>Ranking</div>
</div>
<script>
const sb=supabase.createClient("https://zpqspokbkbbtlockejyk.supabase.co","sb_publishable_7dYLxZX5nNm2aQgekPtYmQ_b8XtzDjR");
let db={times:[],disputas:[],estadios:[],leiloes:[],historico:[]};
function filtrar(){return{times:db.times.filter(t=>t.publico),disputas:db.disputas.filter(d=>d.publico),estadios:db.estadios.filter(e=>e.publico),leiloes:db.leiloes.filter(l=>l.publico),historico:db.historico.filter(h=>h.publico!==false)}}
function render(){
 const f=filtrar();
 const htmlDisputas=f.disputas.length?f.disputas.map(d=>`<div class="card"><div style="display:flex;justify-content:space-between"><span class="badge">LIGA OURO</span><span class="small">${d.estadio||''}</span></div><div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-top:8px"><div><b>${d.casa}</b><br><span class="small">Goleiro: ${d.goleiroCasa||'-'}</span></div><div class="placar">${(d.jogadoresCasa?.filter(j=>j.gol).length||0)} x ${(d.jogadoresFora?.filter(j=>j.gol).length||0)}</div><div style="text-align:right"><b>${d.fora}</b><br><span class="small">Goleiro: ${d.goleiroFora||'-'}</span></div></div><div class="small" style="margin-top:8px">${d.jogadoresCasa?.map(j=>`${j.nome}: ${j.gol?'GOL ⚽':'DEF 🧤'}`).join(' | ')||''}<br>${d.jogadoresFora?.map(j=>`${j.nome}: ${j.gol?'GOL ⚽':'DEF 🧤'}`).join(' | ')||''}<br>Mandante: ${d.mandante} • ${d.estadio}</div></div>`).join(''):`<div class="card"><div class="small" style="text-align:center;padding:20px">Nenhuma disputa pública no momento</div></div>`;
 document.getElementById('feed-disputas').innerHTML=htmlDisputas;document.getElementById('feed-inicio').innerHTML=htmlDisputas;
 document.getElementById('feed-elencos').innerHTML=f.times.map(t=>`<div class="card"><b style="color:#FFCC33">${t.nome}</b> <span class="small">${t.caixa}</span><div class="small">${f.estadios.filter(e=>e.time===t.nome).map(e=>`🏟️ ${e.nome} Nv${e.nivel} ${e.renda} ${e.bonus}`).join('<br>')}</div><div class="elenco-grid">${t.elenco.filter(j=>j.publico!==false).map(j=>`<div class="jog-card"><b>${j.nome}</b><br><span class="small">${j.pos||''} ${j.atq||''} ${j.geraRenda?'💰'+j.renda:''}</span></div>`).join('')||'<span class=small>Sem jogadores públicos</span>'}</div></div>`).join('');
 document.getElementById('feed-leiloes').innerHTML=f.leiloes.length?f.leiloes.map(l=>`<div class="card"><span class="badge" style="background:${l.tipo==='JOGADOR'?'#2ECC71':'#4DA3FF'}">${l.tipo}</span> <b>${l.nome}</b><div class="small" style="margin-top:6px">${l.inicio} → <b style="color:#FFCC33">${l.final}</b> • ${l.comprador} comprou de ${l.vendedor} ${l.geraRenda?'💰 '+l.rendaPorGol:''} ${l.renda?'🏟️ '+l.renda:''}</div></div>`).join(''):`<div class="card"><span class="small">Nenhum leilão público</span></div>`;
 document.getElementById('feed-hist').innerHTML=f.historico.length?`<div class="card"><b style="color:#FFCC33">📜 TRANSFERÊNCIAS PÚBLICAS</b><div class="small" style="margin-top:8px">${f.historico.map(h=>`${h.tipo}: ${h.jogador} ${h.de} → ${h.para} ${h.valor}`).join('<br>')}</div></div>`:'';
 let art={},def={};f.disputas.forEach(d=>{d.jogadoresCasa?.forEach(j=>{if(j.gol)art[j.nome]=(art[j.nome]||0)+1;else def[j.nome]=(def[j.nome]||0)+1});d.jogadoresFora?.forEach(j=>{if(j.gol)art[j.nome]=(art[j.nome]||0)+1;else def[j.nome]=(def[j.nome]||0)+1})});
 document.getElementById('feed-ranking').innerHTML=`<div class="card"><b>⚽ ARTILHARIA</b><div class="small" style="margin-top:8px">${Object.entries(art).sort((a,b)=>b[1]-a[1]).map(e=>`${e[0]}: ${e[1]}`).join('<br>')||'Sem gols'}</div></div><div class="card"><b>🧤 DEFESAS</b><div class="small" style="margin-top:8px">${Object.entries(def).sort((a,b)=>b[1]-a[1]).map(e=>`${e[0]}: ${e[1]}`).join('<br>')||'Sem defesas'}</div></div>`;
}
async function carregar(){const {data}=await sb.from('lef_store').select('data').eq('id',1).single();if(data&&data.data){db=data.data;render()}}
carregar();sb.channel('lef-v6').on('postgres_changes',{event:'*',schema:'public',table:'lef_store'},carregar).subscribe();
document.querySelectorAll('.nav-item').forEach(e=>e.addEventListener('click',()=>{document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('page-'+e.dataset.p).classList.add('active');document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));e.classList.add('active')}));
</script>
</body>
</html>
