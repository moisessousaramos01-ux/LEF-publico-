<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L.E.F - Liga</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}
body{background:#070a12;color:#eef0ff}
#intro{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(800px at 50% 20%,#1a1f3a,#070a12)}
#lef{font-size:110px;font-weight:900;color:#ffcc00;letter-spacing:18px}
#entrarBtn{padding:16px 80px;border-radius:50px;background:#ffcc00;color:#000;font-weight:900;font-size:18px;border:none;cursor:pointer;margin-top:10px}
#app{display:none;max-width:1250px;margin:auto;padding:16px}
.top{background:#101427;border:1px solid #222a4a;padding:12px 16px;border-radius:16px}
.temporada{font-size:28px;font-weight:900;color:#ffcc00}
.tabs{display:flex;gap:8px;margin:16px 0;overflow-x:auto}
.tab{padding:10px 18px;border-radius:30px;background:#101427;border:1px solid #222a4a;cursor:pointer;white-space:nowrap;font-weight:600}
.tab.active{background:#ffcc00;color:#000}
.card{background:#101427;border:1px solid #222a4a;border-radius:18px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.badge{background:#ffcc00;color:#000;padding:3px 9px;border-radius:8px;font-size:11px;font-weight:800}
.badge2{background:#1a1f3a;border:1px solid #2a335a;padding:3px 8px;border-radius:8px;font-size:11px;color:#8ea0ff}
.badgeGreen{background:#00e676;color:#000;padding:3px 9px;border-radius:8px;font-size:11px;font-weight:800}
.playerLine{border-left:3px solid #ffcc00;padding-left:10px;margin-top:10px;background:#0b0e1b;border-radius:0 10px 10px 0;padding:8px 10px}
</style>
</head>
<body>
<div id="intro">
<div id="lef">LEF</div>
<button id="entrarBtn" onclick="document.getElementById('intro').style.display='none';document.getElementById('app').style.display='block';render()">ENTRAR</button>
</div>

<div id="app">
<div class="top"><div class="temporada" id="txtTemp">TEMPORADA I</div></div>
<div class="tabs">
<div class="tab active" onclick="trocaTab('times')">TIMES</div>
<div class="tab" onclick="trocaTab('empresas')">EMPRESAS</div>
<div class="tab" onclick="trocaTab('comp')">COMPETIÇÕES</div>
<div class="tab" onclick="trocaTab('ranking')">RANKING</div>
<div class="tab" onclick="trocaTab('mercado')">MERCADO</div>
</div>

<div id="tab-times"><div id="listaTimes" class="grid"></div></div>
<div id="tab-empresas" style="display:none"><div id="listaEmpresas" class="grid"></div></div>
<div id="tab-comp" style="display:none"><div id="listaComp" class="grid"></div></div>
<div id="tab-ranking" style="display:none"><div class="grid"><div class="card"><h3 style="color:#ffcc00">Empresas Mais Ricas</h3><div id="rankEmpresas"></div></div><div class="card"><h3 style="color:#ffcc00">Jogadores Mais Rentáveis</h3><div id="rankJogadores"></div></div><div class="card"><h3 style="color:#ff2a2a">Falidas / LEF</h3><div id="rankFalidas"></div></div></div></div>
<div id="tab-mercado" style="display:none"><div id="listaMercado" class="grid"></div></div>
</div>

<script>
let temporada=localStorage.getItem('lef_temp')||'TEMPORADA I';
document.getElementById('txtTemp').innerText=temporada;
let times=JSON.parse(localStorage.getItem('lef_times')||'[]');
let empresas=JSON.parse(localStorage.getItem('lef_empresas2')||'[]');
let jogadores=JSON.parse(localStorage.getItem('lef_jogadores2')||'[]');
let comps=JSON.parse(localStorage.getItem('lef_comps')||'[]');
function trocaTab(t){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));event.target.classList.add('active');['times','empresas','comp','ranking','mercado'].forEach(k=>document.getElementById('tab-'+k).style.display='none');document.getElementById('tab-'+t).style.display='block';}
function render(){
 document.getElementById('listaTimes').innerHTML=times.map(t=>`<div class="card"><b>${t.nome}</b> <span class="badge">R$ ${t.caixa}M</span> <span class="badge2">${t.titulos.length} títulos</span><div style="margin-top:6px">${t.elenco.map(id=>{let j=jogadores.find(x=>x.id==id);return j?`<div class="playerLine"><b>${j.nome}</b> ${j.pos} | ${j.empresaNome}</div>`:''}).join('')||'<small style="opacity:.3">Elenco não divulgado</small>'}</div></div>`).join('')||'<p style="opacity:.4">Sem times</p>';
 document.getElementById('listaEmpresas').innerHTML=empresas.map(e=>{let js=jogadores.filter(j=>j.empresaId==e.id);return `<div class="card"><b>${e.nome}</b> <span class="badge">R$ ${e.caixa}M</span><div style="margin-top:6px">${js.map(j=>`<div class="playerLine"><b>${j.nome}</b> ${j.pos} | R$ ${j.renda}M</div>`).join('')||''}</div></div>`;}).join('')||'<p style="opacity:.4">Sem empresas</p>';
 document.getElementById('listaComp').innerHTML=comps.map(c=>`<div class="card"><b>${c.nome}</b> <span class="badge">R$ ${c.premio}M</span><div style="margin-top:8px">${c.campeoes.map(x=>`<div style="background:#0b0e1b;padding:8px;border-radius:10px;margin-top:6px"><b>${x.temp}</b> - 🏆 ${x.campeao} | 🥈 ${x.vice}</div>`).join('')||'<small style="opacity:.3">Sem campeões</small>'}</div></div>`).join('')||'<p style="opacity:.4">Sem competições</p>';
 let lista=jogadores.filter(j=>j.publico);
 document.getElementById('listaMercado').innerHTML=lista.map(j=>{let timeDono=times.find(t=>t.elenco.includes(j.id));return `<div class="card"><b>${j.nome}</b> <span class="badgeGreen">DISPONÍVEL</span><br><span class="badge2">${j.pos} | ${j.nac} | ${j.empresaNome}</span><br><small>Time: ${timeDono?timeDono.nome:'Livre'}</small></div>`;}).join('')||'<p style="opacity:.3;padding:20px;text-align:center">Nenhum jogador no mercado no momento.</p>';
 let empOrdenadas=[...empresas].sort((a,b)=>b.caixa-a.caixa);
 document.getElementById('rankEmpresas').innerHTML=empOrdenadas.map((e,i)=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #222"><span>${i+1}º ${e.nome}</span><b>R$ ${e.caixa}M</b></div>`).join('');
 let jogOrdenados=[...jogadores].sort((a,b)=>b.renda-a.renda);
 document.getElementById('rankJogadores').innerHTML=jogOrdenados.map((j,i)=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #222"><span>${i+1}º ${j.nome}</span><b>R$ ${j.renda}M</b></div>`).join('');
 let falidas=empresas.filter(e=>e.falida);
 document.getElementById('rankFalidas').innerHTML=falidas.map(e=>`<div style="padding:8px 0"><b>${e.nome}</b> → LEF</div>`).join('')||'Nenhuma';
}
render();
</script>
</body>
</html>
