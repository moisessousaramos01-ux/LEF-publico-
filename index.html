<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEF OFICIAL</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f5f7fb}
#welcome{height:100vh;background:#0b0f1a;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.logo{width:120px;height:120px;background:#00ff88;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:bold;color:black}
#welcome h1{margin-top:20px;font-size:32px}
#welcome h1 span{color:#00ff88;cursor:pointer;border-bottom:2px dashed #00ff88}
.btn-visit{margin-top:30px;padding:16px 50px;background:#00ff88;border:none;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer}
header{background:#0b0f1a;color:white;padding:15px 20px;display:flex;justify-content:space-between;align-items:center}
nav{display:flex;gap:8px;padding:15px;overflow-x:auto}
nav button{padding:8px 16px;border-radius:20px;border:none;background:white;font-weight:bold;cursor:pointer;text-transform:uppercase;font-size:11px}
nav button.active{background:#0b0f1a;color:white}
.card{background:white;padding:15px;border-radius:12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.btn-add{padding:10px 15px;background:#00ff88;border:none;border-radius:8px;font-weight:bold;margin-bottom:15px;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.9);display:flex;align-items:center;justify-content:center;z-index:999}
.modal-box{background:white;padding:30px;border-radius:16px;width:320px;color:black}
.modal-box input{width:100%;padding:12px;margin-top:10px;border-radius:8px;border:1px solid #ccc}
</style>
</head>
<body>

<div id="welcome">
  <div class="logo">LEF</div>
  <h1>BEM VINDO AO <span onclick="abrirLogin()">MEU</span> SITE!</h1>
  <button class="btn-visit" onclick="entrarComo('public')">VISITAR</button>
</div>

<div id="app" style="display:none">
  <header>
    <div style="display:flex;align-items:center;gap:10"><div style="background:#00ff88;color:black;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold">LEF</div><b id="header-title">LEF</b></div>
    <button onclick="voltar()" style="background:transparent;color:white;border:1px solid white;padding:6px 12px;border-radius:8px">Sair</button>
  </header>
  <nav>
    <button onclick="setAba('times')" id="btn-times" class="active">TIMES</button>
    <button onclick="setAba('estadios')" id="btn-estadios">ESTÁDIOS</button>
    <button onclick="setAba('jogadores')" id="btn-jogadores">JOGADORES</button>
    <button onclick="setAba('comps')" id="btn-comps">COMPETIÇÕES</button>
    <button onclick="setAba('jogos')" id="btn-jogos">JOGOS</button>
    <button onclick="setAba('ranking')" id="btn-ranking">RANKING</button>
  </nav>
  <main style="padding:15px" id="conteudo"></main>
</div>

<div id="loginModal" class="modal" style="display:none">
  <div class="modal-box">
    <h3>ACESSO ADM</h3>
    <input id="user" placeholder="Usuário">
    <input id="pass" type="password" placeholder="Senha">
    <button onclick="loginADM()" style="width:100%;margin-top:15px;padding:12px;background:black;color:white;border-radius:8px;border:none;font-weight:bold">ENTRAR</button>
    <button onclick="fecharLogin()" style="width:100%;margin-top:8px;padding:8px;background:transparent;border:none">fechar</button>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://uwwpeegyuslbhqhwcets.supabase.co';
const SUPABASE_KEY = 'sb_publishable_7dYLxZX5nNm2aQgekPtYmQ_b8XtzDjR';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let modo='public', aba='times', dados={teams:[], stadiums:[], players:[], comps:[], matches:[]};
function abrirLogin(){document.getElementById('loginModal').style.display='flex'}
function fecharLogin(){document.getElementById('loginModal').style.display='none'}
function voltar(){document.getElementById('welcome').style.display='flex';document.getElementById('app').style.display='none'}
function entrarComo(t){modo=t;document.getElementById('welcome').style.display='none';document.getElementById('app').style.display='block';document.getElementById('header-title').innerText=t==='admin'?'LEF - MODO ADM':'LEF';carregarTudo()}
function loginADM(){const u=document.getElementById('user').value, p=document.getElementById('pass').value; if(u==='lef'&&p==='lef2026'){modo='admin';fecharLogin();entrarComo('admin')}else alert('Erro! Use lef / lef2026')}
async function carregarTudo(){const t=await supabaseClient.from('teams').select('*').order('name');const s=await supabaseClient.from('stadiums').select('*, teams(name)');const p=await supabaseClient.from('players').select('*, teams(name)').order('goals',{ascending:false});const c=await supabaseClient.from('competitions').select('*');const m=await supabaseClient.from('matches').select('*').order('played_at',{ascending:false});dados.teams=t.data||[];dados.stadiums=s.data||[];dados.players=p.data||[];dados.comps=c.data||[];dados.matches=m.data||[];render()}
function setAba(n){aba=n;document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));document.getElementById('btn-'+n).classList.add('active');render()}
function render(){const div=document.getElementById('conteudo');let h='';if(aba==='times'){h+=`<h2>Times (${dados.teams.length})</h2>`;if(modo==='admin')h+=`<button class="btn-add" onclick="addTime()">+ Novo Time</button>`;dados.teams.forEach(t=>{h+=`<div class="card"><span><b>${t.name}</b> - R$ ${(t.balance/1000000).toFixed(1)}M</span>${modo==='admin'?`<span><button onclick="editTime('${t.id}','${t.name}')">Editar</button> <button onclick="delTime('${t.id}')">X</button></span>`:''}</div>`})}if(aba==='estadios'){h+=`<h2>Estádios</h2>`;if(modo==='admin')h+=`<button class="btn-add" onclick="addEstadio()">+ Novo Estádio</button>`;dados.stadiums.forEach(s=>{h+=`<div class="card" style="flex-direction:column;align-items:flex-start"><b>${s.name}</b><span>${s.teams?.name} - Nível ${s.level} | ${s.capacity} | R$ ${s.revenue_per_game} | Rating ${s.rating}</span></div>`})}if(aba==='jogadores'){h+=`<h2>Jogadores</h2>`;if(modo==='admin')h+=`<button class="btn-add" onclick="addJogador()">+ Novo Jogador</button>`;dados.players.forEach(p=>{h+=`<div class="card"><span>${p.name} - ${p.position} - ${p.teams?.name} | G:${p.goals} D:${p.saves}</span>${modo==='admin'?`<button onclick="editJogador('${p.id}',${p.goals},${p.saves})">Editar</button>`:''}</div>`})}if(aba==='comps'){h+=`<h2>Competições</h2>`;if(modo==='admin')h+=`<button class="btn-add" onclick="addComp()">+ Nova Competição</button>`;dados.comps.forEach(c=>{h+=`<div class="card"><b>${c.name}</b> - ${c.type} ${c.has_two_legs?'IDA E VOLTA':''}</div>`})}if(aba==='jogos'){h+=`<h2>Jogos</h2>`;if(modo==='admin')h+=`<button class="btn-add" onclick="addJogo()">+ Lançar Jogo</button>`;dados.matches.forEach(m=>{h+=`<div class="card">${m.home_team?.substring(0,4)} ${m.home_goals} x ${m.away_goals} ${m.away_team?.substring(0,4)} ${m.is_finished?'✅':''}</div>`})}if(aba==='ranking'){const arts=[...dados.players].sort((a,b)=>b.goals-a.goals).slice(0,10);const defs=[...dados.players].sort((a,b)=>b.saves-a.saves).slice(0,10);h+=`<h2>Ranking</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="card" style="flex-direction:column"><h3>Artilheiros</h3>${arts.map((p,i)=>`<div>${i+1}. ${p.name} - ${p.goals}</div>`).join('')}</div><div class="card" style="flex-direction:column"><h3>Defesas</h3>${defs.map((p,i)=>`<div>${i+1}. ${p.name} - ${p.saves}</div>`).join('')}</div></div>`}div.innerHTML=h}
async function addTime(){const n=prompt('Nome do time:');if(n){await supabaseClient.from('teams').insert({name:n});carregarTudo()}}
async function editTime(id,old){const n=prompt('Novo nome:',old);if(n){await supabaseClient.from('teams').update({name:n}).eq('id',id);carregarTudo()}}
async function delTime(id){if(confirm('Apagar?')){await supabaseClient.from('teams').delete().eq('id',id);carregarTudo()}}
async function addEstadio(){const team_id=prompt('ID time: '+dados.teams.map(t=>t.name+':'+t.id).join(' | '));const name=prompt('Nome estádio:');const level=prompt('Nível:');const cap=prompt('Capacidade:');const rev=prompt('Receita:');const rat=prompt('Rating:');await supabaseClient.from('stadiums').insert({team_id,name,level:Number(level),capacity:Number(cap),revenue_per_game:Number(rev),rating:Number(rat)});carregarTudo()}
async function addJogador(){const name=prompt('Nome:');const pos=prompt('Posição:');const team_id=prompt('ID Time:');const val=prompt('Valor:');await supabaseClient.from('players').insert({name,position:pos,team_id,market_value:Number(val)});carregarTudo()}
async function editJogador(id,g,s){const ng=prompt('Gols:',g);const ns=prompt('Defesas:',s);await supabaseClient.from('players').update({goals:Number(ng),saves:Number(ns)}).eq('id',id);carregarTudo()}
async function addComp(){const name=prompt('Nome:');const type=prompt('Tipo: liga, mata_mata, grupos_mata');const two=confirm('Ida e volta?');await supabaseClient.from('competitions').insert({name,type,has_two_legs:two});carregarTudo()}
async function addJogo(){const comp=prompt('ID Comp:');const home=prompt('ID Casa:');const away=prompt('ID Fora:');const hg=prompt('Gols Casa:');const ag=prompt('Gols Fora:');const res=await supabaseClient.from('matches').insert({competition_id:comp,home_team:home,away_team:away,home_goals:Number(hg),away_goals:Number(ag),is_finished:true}).select();if(res.data){const match_id=res.data[0].id;const estadio=await supabaseClient.from('stadiums').select('*').eq('team_id',home).single();if(estadio.data){await supabaseClient.from('match_revenues').insert({match_id,team_id:home,amount:estadio.data.revenue_per_game});alert('Renda gerada R$ '+estadio.data.revenue_per_game)}}carregarTudo()}
</script>
</body>
</html>
