<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>LEF OS</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&family=Geist+Mono&display=swap" rel="stylesheet"><style>body{font-family:Geist;background:#050507}.mono{font-family:Geist Mono}</style></head><body class="text-white"><div class="max-w-[1200px] mx-auto px-6 py-8">
<div class="flex justify-between mb-8"><div class="flex gap-3 items-center"><div class="w-9 h-9 bg-white text-black rounded-full flex items-center justify-center font-bold">L</div><p class="font-bold text-xs tracking-widest">LEF OS PRIVATE</p></div><span class="text-[10px] text-zinc-500 mono">BUILD 03</span></div>

<div class="bg-[#0F0F11] border border-zinc-800 rounded-[24px] p-7 mb-6">
<div class="flex justify-between items-center mb-5"><h2 class="text-[11px] tracking-[0.2em] text-zinc-500 font-bold">CRIAR COMPETIÇÃO DO ZERO</h2><span class="text-[10px] bg-[#7AFF00] text-black px-3 py-1 rounded-full font-bold">FULL CUSTOM</span></div>
<div class="grid md:grid-cols-2 gap-3">
<input id="cName" placeholder="Nome da Liga ex: Copa Nordestina" class="bg-black border border-zinc-800 rounded-2xl px-5 py-4 text-sm outline-none md:col-span-2">
<input id="cTier" placeholder="Tier (ex: TIER 03)" class="bg-black border border-zinc-800 rounded-2xl px-5 py-4 text-sm outline-none">
<input id="cBase" type="number" placeholder="Receita Base R$ M (ex: 12)" class="bg-black border border-zinc-800 rounded-2xl px-5 py-4 text-sm outline-none">
<select id="cFormato" class="bg-black border border-zinc-800 rounded-2xl px-5 py-4 text-sm outline-none"><option value="Pontos Corridos">Pontos Corridos</option><option value="Mata-Mata">Mata-Mata</option><option value="Fase de Grupos + Mata">Grupos + Mata</option><option value="Liga + Playoff">Liga + Playoff</option></select>
<input id="cClubes" type="number" placeholder="Qtd Clubes (ex: 16)" class="bg-black border border-zinc-800 rounded-2xl px-5 py-4 text-sm outline-none">
<input id="cCor" type="color" value="#7AFF00" class="bg-black border border-zinc-800 rounded-2xl h-[56px] w-full p-2">
<input id="cDesc" placeholder="Descrição curta (ex: A copa mais raiz)" class="bg-black border border-zinc-800 rounded-2xl px-5 py-4 text-sm outline-none md:col-span-2">
</div>
<button onclick="addComp()" class="w-full bg-white text-black rounded-full py-4 font-bold text-[13px] tracking-widest mt-4">SALVAR COMPETIÇÃO</button>
</div>

<div class="grid md:grid-cols-[1fr_1fr] gap-6">
<div class="bg-[#EFEFEF] text-black rounded-[24px] p-7"><h3 class="text-[11px] font-bold opacity-50 tracking-widest">MINHAS COMPETIÇÕES CRIADAS</h3><div id="list" class="mt-4 space-y-2"></div></div>
<div class="bg-[#0F0F11] border border-zinc-800 rounded-[24px] p-7"><h3 class="text-[11px] tracking-widest text-zinc-500 font-bold">LANÇAR JOGO RÁPIDO</h3><select id="compSel" class="w-full bg-black border border-zinc-800 rounded-xl px-4 py-3 mt-4 text-sm"></select><div class="grid grid-cols-2 gap-2 mt-3"><input id="casa" placeholder="Casa" class="bg-black border border-zinc-800 rounded-xl px-4 py-3 text-sm"><input id="fora" placeholder="Fora" class="bg-black border border-zinc-800 rounded-xl px-4 py-3 text-sm"><input id="gc" type="number" placeholder="Gols Casa" class="bg-black border border-zinc-800 rounded-xl px-4 py-3 text-sm"><input id="gf" type="number" placeholder="Gols Fora" class="bg-black border border-zinc-800 rounded-xl px-4 py-3 text-sm"></div><button onclick="calc()" class="w-full bg-[#7AFF00] text-black rounded-full py-3 font-bold text-xs mt-3">CALCULAR</button><div id="res" class="hidden mt-4 bg-black rounded-xl p-4"><p id="status" class="text-[10px] mono text-zinc-500"></p><div class="flex justify-between mt-2"><p id="rCasa" class="font-bold"></p><p id="rFora" class="font-bold"></p></div></div></div>
</div>
</div>
<script>
let comps=JSON.parse(localStorage.getItem('lef_full')||'[]');
function render(){let sel=document.getElementById('compSel'); sel.innerHTML=''; let list=document.getElementById('list'); list.innerHTML=''; if(comps.length==0){list.innerHTML='<p class=text-xs opacity-50>Nenhuma ainda. Cria a primeira acima.</p>'} comps.forEach((c,i)=>{let o=document.createElement('option'); o.value=c.base; o.textContent=c.name; sel.appendChild(o); list.innerHTML+=`<div style="border-left:4px solid ${c.cor}" class="bg-white border border-black/10 rounded-xl px-4 py-3 flex justify-between"><div><p class="font-bold text-sm">${c.name}</p><p class="text-[10px] opacity-60">${c.tier} • ${c.formato} • ${c.clubes} clubes • R$${c.base}M • ${c.desc}</p></div><span onclick="del(${i})" class="cursor-pointer opacity-30">x</span></div>`;}); localStorage.setItem('lef_full',JSON.stringify(comps));}
function addComp(){let c={name:document.getElementById('cName').value, tier:document.getElementById('cTier').value||'TIER', base:parseFloat(document.getElementById('cBase').value)||5, formato:document.getElementById('cFormato').value, clubes:document.getElementById('cClubes').value||16, cor:document.getElementById('cCor').value, desc:document.getElementById('cDesc').value}; if(!c.name) return alert('Nome obrigatório'); comps.push(c); render(); document.getElementById('cName').value='';}
function del(i){comps.splice(i,1); render();}
function calc(){let base=parseFloat(document.getElementById('compSel').value)||5; let gc=parseInt(document.getElementById('gc').value||0); let gf=parseInt(document.getElementById('gf').value||0); let comp=base*0.3, vit=base*0.5; let rc,rf,label; if(gc>gf){rc=base+comp+vit; rf=0; label="VIT CASA";} else if(gc<gf){rc=base; rf=comp+vit; label="VIT FORA";} else {rc=base+comp; rf=comp; label="EMPATE";} document.getElementById('res').classList.remove('hidden'); document.getElementById('status').innerText=label; document.getElementById('rCasa').innerText="Casa R$"+rc.toFixed(1)+"M"; document.getElementById('rFora').innerText="Fora R$"+rf.toFixed(1)+"M";}
render();
</script></body></html>
